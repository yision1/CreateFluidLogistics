project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: "/src/main/resources/assets/fluidlogistics/lang/zh_cn.json"
    translation: "/src/main/resources/assets/fluidlogistics/lang/%locale_with_underscore%.json"
    update_option: "update_as_unapproved"

    languages_mapping:
      locale_with_underscore:
        "de": "de_de"
        "es-ES": "es_es"
        "hu": "hu_hu"
        "ko": "ko_kr"
        "pl": "pl_pl"
        "pt-BR": "pt_br"
        "sv-SE": "sv_se"
        "tr": "tr_tr"
        "uk": "uk_ua"
        "en": "en_us"
        "fr": "fr_fr"
        "ja": "ja_jp"
        "ru": "ru_ru"
