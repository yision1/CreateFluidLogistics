name: Crowdin translations

on:
  push:
    branches: [master]
    paths:
      - "src/main/resources/assets/fluidlogistics/lang/zh_cn.json"
      - "src/main/resources/assets/fluidlogistics/lang/en_us.json"
      - "crowdin.yml"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
    inputs:
      upload_github_english:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-translations
  cancel-in-progress: false

jobs:
  sync-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Detect en_us.json changes
        id: english_changes
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          english_path="src/main/resources/assets/fluidlogistics/lang/en_us.json"

          if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- "$english_path"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync master with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: ${{ (github.event_name == 'push' && steps.english_changes.outputs.changed == 'true') || (github.event_name == 'workflow_dispatch' && inputs.upload_github_english) }}
          upload_language: en
          download_translations: true
          skip_untranslated_strings: true

          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_base_branch_name: master
          pull_request_title: "l10n: update Crowdin translations"
          pull_request_body: "Automated translation update from Crowdin."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  sync-1-20-1:
    needs: sync-master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.20.1

      - name: Sync shared translations to 1.20.1
        uses: crowdin/github-action@v2
        with:
          skip_ref_checkout: true
          upload_sources: false
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true

          localization_branch_name: l10n_crowdin_translations_1_20_1
          create_pull_request: true
          pull_request_base_branch_name: 1.20.1
          pull_request_title: "l10n: sync Crowdin translations"
          pull_request_body: "Automated translation update from Crowdin."

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
